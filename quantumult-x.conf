[general]
network_check_url = http://www.apple.com/library/test/success.html
server_check_url = http://www.gstatic.com/generate_204
server_check_timeout = 3000
geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/IP_API.js
resource_parser_url = https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js
excluded_routes = 239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32
dns_exclusion_list = *.10099.com.cn, *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn
udp_drop_list = STUN, QUIC


[dns]
no-system
no-ipv6
prefer-doh3
circumvent-ipv4-answer = 127.0.0.1, 0.0.0.0
circumvent-ipv6-answer = ::1, ::
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query


[policy]
static = 全球加速, direct, 台湾节点, 日本节点, 香港节点, 狮城节点, 美国节点, proxy, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png
static = 兜底分流, 全球加速, direct, 台湾节点, 日本节点, 香港节点, 狮城节点, 美国节点, proxy, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png

static = 哔哩哔哩, direct, img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/bilibili.png
static = 苹果服务, direct, 全球加速, img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
static = 微软服务, direct, 全球加速, img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png
static = 谷歌服务, 全球加速, img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google.png
static = 国际媒体, 全球加速, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/Streaming.png

url-latency-benchmark = 台湾节点, server-tag-regex = (?=.*(台|TW|(?i)Taiwan))^((?!(港|日|韩|新|美)).)*$, check-interval = 900, tolerance = 0, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png
url-latency-benchmark = 日本节点, server-tag-regex = (?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$, check-interval = 900, tolerance = 0, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png
url-latency-benchmark = 香港节点, server-tag-regex = (?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|美)).)*$, check-interval = 900, tolerance = 0, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png
url-latency-benchmark = 狮城节点, server-tag-regex = (?=.*(新|狮|獅|SG|(?i)Singapore))^((?!(港|台|日|韩|美)).)*$, check-interval = 900, tolerance = 0, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png
url-latency-benchmark = 美国节点, server-tag-regex = (?=.*(美|US|(?i)States|American))^((?!(港|台|日|韩|新)).)*$, check-interval = 900, tolerance = 0, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png


[server_local]
[server_remote]


[filter_local]
# 忽略特定网站
host, go-kratos.dev, direct

# > 一些比较容易忽视的分流
